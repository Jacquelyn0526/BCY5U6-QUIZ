<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麒麟的汉字魔法 (Qilin's Character Magic)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap');

        :root {
            --kaiti-font: 'KaiTi', '楷体', 'STKaiti', 'BiauKai', serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .game-container {
            background-color: rgba(255, 255, 255, 0.9);
            border: 8px solid #E63946;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            margin-top: 20px;
            margin-bottom: 20px;
            max-width: 900px;
            width: 90%;
            text-align: center;
            position: relative;
            box-sizing: border-box;
        }

        /* Stats Bar (Score, Lives, Progress) */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F1FAEE;
            padding: 10px 20px;
            border-radius: 15px;
            border: 2px solid #A8DADC;
            margin-bottom: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .score-display { color: #1D3557; }
        .lives-display { color: #E63946; letter-spacing: 2px; }
        .progress-display { color: #457B9D; }

        h1 {
            font-family: var(--kaiti-font);
            color: #D62828;
            font-size: 3.5em;
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(214, 40, 40, 0.3);
            letter-spacing: 2px;
        }

        .qilin-mascot {
            font-size: 4em;
            margin: -10px 0 10px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .action-btn {
            background-color: #457B9D;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .action-btn:hover { background-color: #1D3557; }
        .action-btn:active { transform: scale(0.95); }

        .word-section {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .char-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .pinyin {
            font-size: 1.5em;
            font-weight: bold;
            color: #0077B6;
            margin-bottom: 10px;
            background: #e0fbfc;
            padding: 5px 15px;
            border-radius: 10px;
            border: 2px solid #90E0EF;
        }

        .drop-zone {
            width: 80px;
            height: 80px;
            border: 3px dashed #F77F00;
            border-radius: 15px;
            background-color: #FFF3E0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5em;
            font-family: var(--kaiti-font);
            transition: all 0.3s ease;
        }

        .drop-zone.drag-over {
            background-color: #FFD166;
            transform: scale(1.1);
        }

        .drop-zone.filled {
            border: 3px solid #2A9D8F;
            background-color: #E9EDC9;
            color: #264653;
        }

        .drag-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            padding: 20px;
            background: #FFE8D6;
            border-radius: 15px;
            border: 2px solid #DDBEA9;
        }

        .drag-item {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #F4A261, #E76F51);
            color: white;
            font-size: 3em;
            font-family: var(--kaiti-font);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
            transition: transform 0.1s;
            /* CRITICAL FOR MOBILE DRAG: Prevents screen scrolling when touching the element */
            touch-action: none; 
        }

        .drag-item:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .drag-item.hidden { display: none; }

        #stroke-container {
            margin: 20px auto;
            width: 150px;
            height: 150px;
            background-color: white;
            border: 4px solid #8AB17D;
            border-radius: 10px;
            display: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .instruction {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .next-btn {
            background-color: #2A9D8F;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
            margin-top: 10px;
            display: none;
        }

        .next-btn:hover { background-color: #21867A; }

        .score-popup {
            position: absolute;
            font-size: 2em;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            z-index: 100;
        }
        
        .score-plus { color: #2A9D8F; }
        .score-minus { color: #E63946; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-50px); }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 600px) {
            .game-container {
                padding: 15px;
                border-width: 5px;
                margin-top: 10px;
            }

            .stats-bar {
                flex-direction: column;
                gap: 5px;
                font-size: 1em;
                padding: 10px;
            }

            h1 { font-size: 2.2em; }
            .qilin-mascot { font-size: 3em; margin-bottom: 0; }
            .instruction { font-size: 0.95em; }

            .word-section { gap: 10px; }
            .drag-section { gap: 10px; padding: 15px; }

            /* Shrink boxes so long words (4 chars) fit on mobile screens */
            .drop-zone {
                width: 55px;
                height: 55px;
                font-size: 2.5em;
                border-width: 2px;
                border-radius: 10px;
            }

            .drag-item {
                width: 55px;
                height: 55px;
                font-size: 2.5em;
                border-radius: 10px;
            }

            .pinyin {
                font-size: 1em;
                padding: 3px 8px;
                margin-bottom: 5px;
            }

            .action-btn {
                font-size: 1em;
                padding: 10px 15px;
            }

            #stroke-container {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="stats-bar">
            <div class="score-display">得分 (Score): <span id="score">0</span></div>
            <div class="lives-display" id="lives">❤️❤️❤️❤️❤️</div>
            <div class="progress-display"><span id="progress">1 / 14</span></div>
        </div>

        <div class="qilin-mascot" id="mascot">🐉✨</div>
        <h1 id="game-title">麒麟学词语</h1>
        <p class="instruction" id="instruction-text">Listen to the word, then drag the correct characters. Beware of tricks!</p>
        
        <button class="action-btn" id="audio-btn" onclick="playAudio()">🔊 读出来 (Read Aloud)</button>

        <div id="word-section" class="word-section"></div>
        <div id="drag-section" class="drag-section"></div>
        <div id="stroke-container"></div>

        <button id="next-btn" class="next-btn" onclick="nextWord()">Next Word (下一个)</button>
        <button id="restart-btn" class="next-btn" onclick="restartGame()" style="background-color: #E63946;">Try Again (再玩一次)</button>
    </div>

    <script>
        // Initialize Mobile Drag and Drop Polyfill
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });

        // Prevents page scrolling while dragging on mobile devices
        window.addEventListener('touchmove', function() {}, {passive: false});

        const words = [
            { chars: ["手", "舞", "足", "蹈"], pinyin: ["shǒu", "wǔ", "zú", "dǎo"], distractors: ["毛", "无", "疋", "滔", "走"] },
            { chars: ["逊", "色"], pinyin: ["xùn", "sè"], distractors: ["孙", "选", "绝", "巴", "邑"] },
            { chars: ["分", "辨"], pinyin: ["fēn", "biàn"], distractors: ["瓣", "辫", "辩", "刀", "八"] },
            { chars: ["腻"], pinyin: ["nì"], distractors: ["贰", "贼", "贝", "叽"] },
            { chars: ["彼", "此"], pinyin: ["bǐ", "cǐ"], distractors: ["波", "破", "些", "化", "坡"] },
            { chars: ["酬", "劳"], pinyin: ["chóu", "láo"], distractors: ["州", "酉", "萤", "旁", "愁"] },
            { chars: ["辜", "负"], pinyin: ["gū", "fù"], distractors: ["幸", "辛", "贝", "贪", "苦"] },
            { chars: ["咳", "嗽"], pinyin: ["ké", "sou"], distractors: ["孩", "刻", "漱", "喇", "赖"] },
            { chars: ["碧", "绿"], pinyin: ["bì", "lǜ"], distractors: ["珀", "壁", "录", "剥", "石"] },
            { chars: ["电", "线", "杆"], pinyin: ["diàn", "xiàn", "gān"], distractors: ["龟", "钱", "找", "汗", "旱"] },
            { chars: ["竟"], pinyin: ["jìng"], distractors: ["竞", "免", "克", "兄", "镜"] },
            { chars: ["摔"], pinyin: ["shuāi"], distractors: ["率", "蟀", "擦", "捧", "碎"] },
            { chars: ["捣", "蛋"], pinyin: ["dǎo", "dàn"], distractors: ["岛", "鸟", "延", "虫", "延"] },
            { chars: ["扫", "帚"], pinyin: ["sào", "zhou"], distractors: ["打", "妇", "寻", "归", "雪"] }
        ];
        
        let currentIndex = 0;
        let correctPlacements = 0;
        let hanziWriter = null;
        let score = 0;
        let lives = 5;

        const wordSection = document.getElementById('word-section');
        const dragSection = document.getElementById('drag-section');
        const strokeContainer = document.getElementById('stroke-container');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        const progress = document.getElementById('progress');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playAudio() {
            const currentWordText = words[currentIndex].chars.join('');
            const utterance = new SpeechSynthesisUtterance(currentWordText);
            utterance.lang = 'zh-CN'; 
            utterance.rate = 0.8; 
            window.speechSynthesis.speak(utterance);
        }

        function updateStats() {
            scoreEl.innerText = score;
            let hearts = "";
            for(let i=0; i<5; i++) {
                hearts += (i < lives) ? "❤️" : "🖤";
            }
            livesEl.innerText = hearts;
        }

        function showPopupScore(element, points, isPositive) {
            const rect = element.getBoundingClientRect();
            const popup = document.createElement('div');
            popup.className = `score-popup ${isPositive ? 'score-plus' : 'score-minus'}`;
            popup.innerText = (isPositive ? '+' : '') + points;
            
            popup.style.left = (rect.left + (rect.width/2) - 10) + 'px';
            popup.style.top = rect.top + 'px';
            
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        function restartGame() {
            score = 0;
            lives = 5;
            currentIndex = 0;
            document.getElementById('mascot').innerText = "🐉✨";
            document.getElementById('game-title').innerText = "麒麟学词语";
            document.getElementById('instruction-text').style.display = "block";
            document.getElementById('audio-btn').style.display = "inline-flex";
            restartBtn.style.display = 'none';
            loadGame();
        }

        function triggerGameOver() {
            wordSection.innerHTML = `<h2 style="font-family: var(--kaiti-font); color: #E63946;">💔 游戏结束 (Game Over) 💔</h2><p>You ran out of hearts! Your final score is ${score}.</p>`;
            dragSection.innerHTML = '';
            strokeContainer.style.display = 'none';
            nextBtn.style.display = 'none';
            document.getElementById('audio-btn').style.display = 'none';
            restartBtn.style.display = 'inline-block';
            document.getElementById('mascot').innerText = "🐉💧"; 
        }

        function loadGame() {
            updateStats();
            correctPlacements = 0;
            wordSection.innerHTML = '';
            dragSection.innerHTML = '';
            strokeContainer.style.display = 'none';
            strokeContainer.innerHTML = '';
            nextBtn.style.display = 'none';
            progress.innerText = `${currentIndex + 1} / ${words.length}`;

            const currentWord = words[currentIndex];
            let draggableChars = [...currentWord.chars, ...currentWord.distractors];
            draggableChars = shuffleArray(draggableChars);

            currentWord.chars.forEach((char, index) => {
                const group = document.createElement('div');
                group.className = 'char-group';

                const pinyinDiv = document.createElement('div');
                pinyinDiv.className = 'pinyin';
                pinyinDiv.innerText = currentWord.pinyin[index];

                const dropZone = document.createElement('div');
                dropZone.className = 'drop-zone';
                dropZone.dataset.char = char;
                dropZone.dataset.tries = 0; 

                dropZone.addEventListener('dragover', dragOver);
                dropZone.addEventListener('dragenter', dragEnter);
                dropZone.addEventListener('dragleave', dragLeave);
                dropZone.addEventListener('drop', drop);

                group.appendChild(pinyinDiv);
                group.appendChild(dropZone);
                wordSection.appendChild(group);
            });

            draggableChars.forEach(char => {
                const dragItem = document.createElement('div');
                dragItem.className = 'drag-item';
                dragItem.draggable = true;
                dragItem.innerText = char;
                dragItem.id = 'drag-' + Math.random().toString(36).substr(2, 9);
                
                dragItem.addEventListener('dragstart', dragStart);
                dragItem.addEventListener('dragend', dragEnd);

                dragSection.appendChild(dragItem);
            });
        }

        function dragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.id);
            setTimeout(() => e.target.style.opacity = '0.5', 0);
        }

        function dragEnd(e) { e.target.style.opacity = '1'; }
        
        function dragOver(e) { e.preventDefault(); }

        function dragEnter(e) {
            e.preventDefault();
            if (!this.classList.contains('filled')) this.classList.add('drag-over');
        }

        function dragLeave(e) { this.classList.remove('drag-over'); }

        function drop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');

            const id = e.dataTransfer.getData('text/plain');
            const draggedElement = document.getElementById(id);
            
            if (!draggedElement || this.classList.contains('filled')) return;

            const draggedChar = draggedElement.innerText;
            const targetChar = this.dataset.char;
            
            let attempts = parseInt(this.dataset.tries);
            attempts++;
            this.dataset.tries = attempts;

            if (draggedChar === targetChar) {
                this.innerText = draggedChar;
                this.classList.add('filled');
                draggedElement.classList.add('hidden');
                correctPlacements++;
                
                let pointsEarned = 0;
                if (attempts === 1) pointsEarned = 2;
                else if (attempts === 2) pointsEarned = 1;
                
                if (pointsEarned > 0) {
                    score += pointsEarned;
                    showPopupScore(this, pointsEarned, true);
                    updateStats();
                }

                playStrokeAnimation(draggedChar);

                if (correctPlacements === words[currentIndex].chars.length) {
                    setTimeout(() => {
                        nextBtn.style.display = 'inline-block';
                        playAudio(); 
                    }, 1000);
                }
            } else {
                score -= 1;
                lives -= 1;
                updateStats();
                showPopupScore(this, -1, false);

                draggedElement.style.transform = 'translateX(-10px)';
                setTimeout(() => draggedElement.style.transform = 'translateX(10px)', 100);
                setTimeout(() => draggedElement.style.transform = 'translateX(0)', 200);

                if (lives <= 0) {
                    setTimeout(() => triggerGameOver(), 500);
                }
            }
        }

        function playStrokeAnimation(character) {
            strokeContainer.style.display = 'block';
            strokeContainer.innerHTML = ''; 
            
            // Adjust stroke container size for mobile gracefully
            const isMobile = window.innerWidth <= 600;
            const writerSize = isMobile ? 120 : 150;

            hanziWriter = HanziWriter.create('stroke-container', character, {
                width: writerSize,
                height: writerSize,
                padding: 10,
                strokeAnimationSpeed: 1.5, 
                delayBetweenStrokes: 50,
                showOutline: true,
                strokeColor: '#D62828',
                outlineColor: '#DDD'
            });

            hanziWriter.animateCharacter();
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= words.length) {
                wordSection.innerHTML = `<h2 style="font-family: var(--kaiti-font);">🎉 恭喜你！太棒了！🎉</h2><p>You completed all words with a score of ${score}!</p>`;
                dragSection.innerHTML = '';
                strokeContainer.style.display = 'none';
                nextBtn.style.display = 'none';
                document.getElementById('audio-btn').style.display = 'none';
                restartBtn.style.display = 'inline-block';
                restartBtn.innerText = "Play Again (再玩一次)";
            } else {
                loadGame();
            }
        }

        window.onload = loadGame;
    </script>
</body>
</html>
